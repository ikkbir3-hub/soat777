<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Neon Digital Clock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;
background:radial-gradient(circle,#172554,#020617);font-family:Arial,sans-serif;overflow:hidden;padding:20px}
.clock-box{width:min(100%,650px);padding:clamp(28px,7vw,55px) 20px;border-radius:30px;text-align:center;
background:rgba(255,255,255,.05);border:2px solid rgba(0,255,255,.4);
box-shadow:0 0 20px #00ffff,0 0 60px rgba(0,255,255,.3),inset 0 0 30px rgba(0,255,255,.1);
backdrop-filter:blur(15px);animation:glow 3s infinite alternate}
h1{color:white;font-size:clamp(17px,4vw,25px);letter-spacing:clamp(2px,1vw,6px);margin-bottom:30px;text-shadow:0 0 15px cyan}
#time{color:#00ffff;font-size:clamp(42px,12vw,82px);font-weight:bold;letter-spacing:clamp(1px,1vw,5px);
text-shadow:0 0 10px #00ffff,0 0 25px #00ffff,0 0 50px #00ffff;transform:perspective(400px) rotateX(5deg)}
#date{color:white;font-size:clamp(16px,4vw,21px);margin-top:25px;text-shadow:0 0 10px #00ffff}
#day{color:#00ffff;margin-top:12px;font-size:17px}
@keyframes glow{from{box-shadow:0 0 20px #00ffff, inset 0 0 20px rgba(0,255,255,.08)}
to{box-shadow:0 0 50px #0088ff,0 0 90px #00ffff,inset 0 0 30px rgba(0,255,255,.15)}}
</style>
</head>
<body>
<main class="clock-box">
<h1>NEON DIGITAL CLOCK</h1>
<div id="time">00:00:00</div>
<div id="date"></div>
<div id="day"></div>
</main>
<script>
function updateClock(){
  const now=new Date();
  document.getElementById("time").textContent=
    [now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":");
  document.getElementById("date").textContent=now.toLocaleDateString("uz-UZ",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("day").textContent=now.toLocaleDateString("uz-UZ",{weekday:"long"});
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
